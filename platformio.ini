; CAIR - Smarter Air Purifier
; Board : ESP32-S3-DevKitC-1 + GPIO shield (khurslabs)
; UART0 (GPIO43/44, port USB "UART") -> serial monitor / console + upload
; UART1 (GPIO17/18, USB-TTL eksternal) -> SDS011 / simulator Python

[env:esp32-s3-devkitc-1]
platform      = espressif32@^6.9.0
board         = esp32-s3-devkitc-1
framework     = arduino

; Serial di-core = UART0, bukan USB CDC
build_flags   =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0

; ENS160 + AHT21 pakai driver sendiri (src/env_task.cpp), WiFi/WebServer/DNS/mDNS bawaan core
lib_deps      =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    remotexy/RemoteXY@^4.1.10

; BLE + WiFi besar -> partisi app 3 MB (tanpa OTA)
board_build.partitions = huge_app.csv

; web/index.html -> include/web_index.h (gzip) otomatis sebelum build
extra_scripts = pre:tools/embed_web.py

upload_speed  = 921600
; upload & serial monitor lewat port USB "UART"
; upload_port  = COM5
monitor_speed = 115200
; monitor_port = COM5
