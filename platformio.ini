; CAIR - Smarter Air Purifier
; Dua environment, satu kode:
;   esp32-s3-devkitc-1 : ESP32-S3-DevKitC-1 N16R8 + GPIO shield khurslabs (default)
;   d1_r32             : WEMOS D1 R32 (ESP32-WROOM-32, bentuk Arduino UNO)
; Peta pin tiap board ada di include/config.h (dipilih lewat -DBOARD_D1R32).
;
; Build/upload board tertentu:
;   pio run -e esp32-s3-devkitc-1 -t upload
;   pio run -e d1_r32 -t upload
; Di VS Code: pilih environment di status bar bawah (ikon "env:...").

[platformio]
default_envs = esp32-s3-devkitc-1

; ---------- pengaturan bersama ----------
[env]
platform      = espressif32@^6.9.0
framework     = arduino

; ENS160 + AHT21 pakai driver sendiri (src/env_task.cpp), WiFi/WebServer/DNS/mDNS bawaan core
lib_deps      =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    remotexy/RemoteXY@^4.1.10

; BLE + WiFi besar -> partisi app 3 MB (tanpa OTA)
board_build.partitions = huge_app.csv

; web/index.html -> include/web_index.h (gzip) otomatis sebelum build
extra_scripts = pre:tools/embed_web.py

monitor_speed = 115200

; ---------- ESP32-S3-DevKitC-1 + shield khurslabs ----------
; UART0 (GPIO43/44, port USB "UART") -> serial monitor / console + upload
; UART1 (GPIO17/18, USB-TTL eksternal) -> SDS011 / simulator Python
[env:esp32-s3-devkitc-1]
board         = esp32-s3-devkitc-1
; Serial di-core = UART0, bukan USB CDC
build_flags   =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
upload_speed  = 921600
; upload_port  = COM5
; monitor_port = COM5

; ---------- WEMOS D1 R32 (ESP32 klasik) ----------
; UART0 (GPIO1/3, USB CH340) -> serial monitor / console + upload
; UART2 (GPIO16/17)          -> SDS011 / simulator Python
[env:d1_r32]
board         = wemos_d1_uno32
build_flags   =
    -DBOARD_D1R32
    -DCORE_DEBUG_LEVEL=0
    -DENABLE_REMOTEXY=0 
    -DENABLE_WEB=1
upload_speed  = 921600
; upload_port  = COM6
; monitor_port = COM6
